name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

  terraform-validate:
    runs-on: ubuntu-latest
    needs: terraform-fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: terraform/environments/prod
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: terraform/environments/prod
        run: terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: terraform/environments/prod
        run: terraform init -backend=false
      - name: Terraform plan
        working-directory: terraform/environments/prod
        run: terraform plan -var-file=terraform.tfvars.example -out=tfplan.binary
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // plan output is captured in the job log

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          find kubernetes -name '*.yaml' | while read f; do
            echo "Validating $f"
          done
        continue-on-error: true

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/charts/app
