# ExternalSecrets Operator - pulls secrets from Vault into Kubernetes SecretStore
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: external-secrets
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: px-app-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: px-app-secrets-k8s
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: px-app
        property: db-password
    - secretKey: stripe-secret-key
      remoteRef:
        key: px-app
        property: stripe-secret-key
    - secretKey: jwt-secret
      remoteRef:
        key: px-app
        property: jwt-secret
